<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DAY VIEW</title>
    <link rel="stylesheet" href="day.css" />
  </head>
  <body>
    <div class="container">
      <div id="showing-date"></div>

      <!-- The Scroll Box with Time Slots -->
      <div class="scroll-box">
        <div class="hourlyTimeSlots" data-time="0">0</div>
        <div class="hourlyTimeSlots" data-time="1">1</div>
        <div class="hourlyTimeSlots" data-time="2">2</div>
        <div class="hourlyTimeSlots" data-time="3">3</div>
        <div class="hourlyTimeSlots" data-time="4">4</div>
        <div class="hourlyTimeSlots" data-time="5">5</div>
        <div class="hourlyTimeSlots" data-time="6">6</div>
        <div class="hourlyTimeSlots" data-time="7">7</div>
        <div class="hourlyTimeSlots" data-time="8">8</div>
        <div class="hourlyTimeSlots" data-time="9">9</div>
        <div class="hourlyTimeSlots" data-time="10">10</div>
        <div class="hourlyTimeSlots" data-time="11">11</div>
        <div class="hourlyTimeSlots" data-time="12">12</div>
        <div class="hourlyTimeSlots" data-time="13">13</div>
        <div class="hourlyTimeSlots" data-time="14">14</div>
        <div class="hourlyTimeSlots" data-time="15">15</div>
        <div class="hourlyTimeSlots" data-time="16">16</div>
        <div class="hourlyTimeSlots" data-time="17">17</div>
        <div class="hourlyTimeSlots" data-time="18">18</div>
        <div class="hourlyTimeSlots" data-time="19">19</div>
        <div class="hourlyTimeSlots" data-time="20">20</div>
        <div class="hourlyTimeSlots" data-time="21">21</div>
        <div class="hourlyTimeSlots" data-time="22">22</div>
        <div class="hourlyTimeSlots" data-time="23">23</div>
      </div>

      <!-- Event Modal to Add Event -->
      <div id="eventModal" class="event-modal">
        <div class="modal-content">
          <span class="close-btn">&times;</span>
          <h3>Set Event Time</h3>
          <form id="eventForm">
            <label for="eventTitle">Event Title:</label>
            <input type="text" id="eventTitle" name="eventTitle" required />

            <label for="eventColor">Event Color:</label>
            <input type="color" id="eventColor" name="eventColor" required />

            <!-- Start Time Dropdown -->
            <label for="startTime">Start Time (24-Hour Format):</label>
            <select id="startTime" name="startTime" required>
              <option value="" disabled selected>Select start time</option>
              <option value="0">00:00</option>
              <option value="1">01:00</option>
              <option value="2">02:00</option>
              <option value="3">03:00</option>
              <option value="4">04:00</option>
              <option value="5">05:00</option>
              <option value="6">06:00</option>
              <option value="7">07:00</option>
              <option value="8">08:00</option>
              <option value="9">09:00</option>
              <option value="10">10:00</option>
              <option value="11">11:00</option>
              <option value="12">12:00</option>
              <option value="13">13:00</option>
              <option value="14">14:00</option>
              <option value="15">15:00</option>
              <option value="16">16:00</option>
              <option value="17">17:00</option>
              <option value="18">18:00</option>
              <option value="19">19:00</option>
              <option value="20">20:00</option>
              <option value="21">21:00</option>
              <option value="22">22:00</option>
              <option value="23">23:00</option>
            </select>

            <!-- End Time Dropdown -->
            <label for="endTime">End Time (24-Hour Format):</label>
            <select id="endTime" name="endTime" required>
              <option value="" disabled selected>Select end time</option>
              <option value="1">01:00</option>
              <option value="2">02:00</option>
              <option value="3">03:00</option>
              <option value="4">04:00</option>
              <option value="5">05:00</option>
              <option value="6">06:00</option>
              <option value="7">07:00</option>
              <option value="8">08:00</option>
              <option value="9">09:00</option>
              <option value="10">10:00</option>
              <option value="11">11:00</option>
              <option value="12">12:00</option>
              <option value="13">13:00</option>
              <option value="14">14:00</option>
              <option value="15">15:00</option>
              <option value="16">16:00</option>
              <option value="17">17:00</option>
              <option value="18">18:00</option>
              <option value="19">19:00</option>
              <option value="20">20:00</option>
              <option value="21">21:00</option>
              <option value="22">22:00</option>
              <option value="23">23:00</option>
            </select>

            <button type="submit">Save Event</button>
          </form>
        </div>
      </div>
    </div>
    <script src="day.js"></script>
  </body>
</html>
