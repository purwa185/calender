<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendar</title>
  <link rel="stylesheet" href="styles.css">
</head><body>
  <div class="calendar">
    <!-- Month and Year Header -->
    <div class="calendar-header">
        <div class="set-date">
            <span id="set-date-span">Set Date:</label>
            <input type="text" id="set-date-input" placeholder="dd/mm/yyyy">
            <button id="set-date-btn">Enter</button>
          </div>
       <div class="show-dy">
      <button id="prev-month" class="arrow-btn">←</button>
      <span id="month-year"> January 2025 </span>
      <button id="next-month" class="arrow-btn">→</button>
        </div>
        <div class="view-options">
          <span id="view-span">View: </span>
          <select id="view-select">
              <option value="month" selected>Month View</option>
              <option value="week">Week View</option>
              <option value="day">Day View</option>
          </select>
      </div>
    </div>
    <!-- Calendar Grid -->
    <div class="calendar-grid">
       <div class="weekday">Sunday</div>
       <div class="weekday">Monday</div>
       <div class="weekday">Tuesday</div>
       <div class="weekday">Wednesday</div>
       <div class="weekday">Thursday</div>
       <div class="weekday">Friday</div>
       <div class="weekday">Saturday</div>
       <!-- Days will be added dynamically here -->
    </div>
  </div>
  <script src="index.js"></script>
</body>
</html>
