<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calender2</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <nav>
      <ul class="navbar">
        <li>
          <a href="#logo"
            ><img src="/photos/menu image.png" alt="Logo" class="navbar-logo"
          /></a>
        </li>
        <li><a href="#home" id="title">Calendar</a></li>
        <li><a href="#about" id="today">Today</a></li>
        <li>
          <a href="#services">
            <img src="/photos/left-arrow.png" alt="Logo" id="leftarrow"
          /></a>
        </li>
        <li>
          <a href="#services">
            <img src="/photos/right-arrow.png" alt="Logo" id="rightarrow"
          /></a>
        </li>
        <li>
          <a href="#contact"> <div id="display-date"></div> </a>
        </li>
        <li>
          <a href="#about" id="selectbox">
            <select id="views" name="views">
              <option value="month-view">Month</option>
              <option value="day-view">Day</option>
              <option value="week-view">Week</option>
            </select>
          </a>
        </li>
      </ul>
    </nav>

    <div class="container">
      <div class="section-left">
        <!-- Content for left section -->
        <div class="left1">
          <div class="addeventbtn">
            <img src="/photos/plus.png" alt="Logo" class="plus" />
            <span id="addevent"> Create </span>
          </div>

          <div id="eventModal" class="modal">
            <div class="modal-content">
              <span id="closeModal" class="close">&times;</span>
              <h2>Create Event</h2>
              <form id="eventForm">
                <label for="eventName">Event Name:</label>
                <input type="text" id="eventName" name="eventName" required />
                <label for="eventDescription">Event Description:</label>
                <textarea
                  id="eventDescription"
                  name="eventDescription"
                  required
                ></textarea>
                <label for="eventStartTime">Event Start Time:</label>
                <input
                  type="time"
                  id="eventStartTime"
                  name="eventStartTime"
                  required
                />

                <label for="eventEndTime">Event End Time:</label>
                <input
                  type="time"
                  id="eventEndTime"
                  name="eventEndTime"
                  required
                />
                <button type="submit">Save Event</button>
              </form>
            </div>
          </div>
        </div>
        <div class="calendar">
          <div class="calendar-header">
            <div class="show-dy">
              <span id="month-year"> February 2025 </span>
            </div>
            <img src="/photos/left-arrow.png" alt="Logo" id="prev-month" />
            <img src="/photos/right-arrow.png" alt="Logo" id="next-month" />
          </div>
          <div class="calendar-grid">
            <div class="weekday">S</div>
            <div class="weekday">M</div>
            <div class="weekday">T</div>
            <div class="weekday">W</div>
            <div class="weekday">T</div>
            <div class="weekday">F</div>
            <div class="weekday">S</div>
            <!-- Days will be added dynamically here -->
          </div>
        </div>
      </div>
      <div class="section-right" id="content">
        <!-- Content for right section -->
      </div>
      <div id="eventModal2" class="modal2">
        <div class="modal-content2">
          <span id="closeModal2" class="close2">&times;</span>
          <h2>Create Event</h2>
          <form id="eventForm2">
            <label for="eventName2">Event Name:</label>
            <input type="text" id="eventName2" name="eventName2" required />
      
            <label for="eventDescription2">Event Description:</label>
            <textarea id="eventDescription2" name="eventDescription2" required></textarea>
      
            <label for="eventStartTime2">Event Start Time:</label>
            <input type="time" id="eventStartTime2" name="eventStartTime2" required />
      
            <label for="eventEndTime2">Event End Time:</label>
            <input type="time" id="eventEndTime2" name="eventEndTime2" required />
      
            <div class="modal-buttons2">
              <button type="submit">Save Event</button>
              <button type="button" id="deleteEvent2" class="delete-button2">Delete Event</button>
            </div>
          </form>
        </div>
      </div>
    </div>
    <script src="index.js"></script>
  </body>
</html>
